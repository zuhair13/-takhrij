[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "takhrij"
version = "0.4.1"
description = "Corpus-bounded, adversarial Arabic attestation research assistant"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "Flask==3.1.3",
  "google-adk==2.7.1",
  "google-auth==2.57.0",
  "google-cloud-firestore==2.29.0",
  "google-cloud-pubsub==2.39.2",
  "google-genai==2.20.0",
  "gunicorn==26.2.0",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "coverage==7.10.7",
  "ruff==0.13.2",
]

[project.scripts]
takhrij-build-index = "takhrij.index_builder:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
branch = true
source = ["takhrij"]

[tool.coverage.report]
show_missing = true
fail_under = 85
